services:
  - type: web
    name: nudas-cafe
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
      - path: /media/*
        name: Cache-Control
        value: public, max-age=86400, immutable
